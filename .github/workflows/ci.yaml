name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    container: golangci/golangci-lint:v2.10.1-alpine
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check/check.sh

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.25"
      - run: make test

  integration-test:
    name: Integration test (session)
    runs-on: ubuntu-latest
    needs: [check, unit-test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.25"
      - name: Run session integration tests
        env:
          GOSIMOV_INTEGRATION: "true"
          INTEGRATION_OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          INTEGRATION_OPENCODE_GO_MODEL: deepseek-v4-flash
          OPENCODEGO_INTEGRATION_SUMMARY_MODEL: deepseek-v4-flash
          OPENCODEGO_INTEGRATION_TIMEOUT: 4m
        run: go test -v -count=1 ./tests/integration/session/
