name: PR Review

on:
  pull_request_target:
    types: [opened, edited, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  review:
    if: |
      (
        github.event_name == 'pull_request_target' &&
        (
          contains(github.event.pull_request.title, '@gosimov-review') ||
          contains(github.event.pull_request.body || '', '@gosimov-review')
        ) &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@gosimov-review') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.25"

      - name: Run PR review example
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENCODE_GO_MODEL: deepseek-v4-flash
        run: go run ./examples/pr-review --work-dir "$GITHUB_WORKSPACE"
